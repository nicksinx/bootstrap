name: bootstrap-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Compile Python entry points
        run: PYTHONPYCACHEPREFIX=/tmp/okf-pycache python -m compileall -q scripts skills tests
      - name: Run strict validation suite
        run: make check
